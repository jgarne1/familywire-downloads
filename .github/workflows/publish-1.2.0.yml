name: Publish verified FamilyWire 1.2.0
on:
  push:
    branches: [main]
    paths: ['.release/1.2.0.json', '.github/workflows/publish-1.2.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: familywire-release-1.2.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CI packages and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release-publisher.py --inputs .release/1.2.0.json
